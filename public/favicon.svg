<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="55%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#04050d"/>
    </radialGradient>
    <radialGradient id="nebula" cx="78%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cffafe"/>
      <stop offset="75%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#nebula)"/>
  <g fill="#ffffff">
    <circle cx="12" cy="13" r="1.1" opacity="0.9"/>
    <circle cx="52" cy="50" r="1" opacity="0.7"/>
    <circle cx="10" cy="47" r="0.8" opacity="0.6"/>
    <circle cx="46" cy="10" r="0.8" opacity="0.7"/>
    <circle cx="55" cy="30" r="0.7" opacity="0.6"/>
  </g>
  <!-- 軌道の奥側 → 恒星 → 軌道の手前側 の順に重ねて立体感を出す -->
  <g transform="rotate(-18 32 33)">
    <ellipse cx="32" cy="33" rx="24" ry="9" fill="none" stroke="url(#orbit)" stroke-width="3" stroke-opacity="0.6"/>
  </g>
  <circle cx="32" cy="33" r="15" fill="url(#sun)"/>
  <circle cx="32" cy="33" r="6.5" fill="#ffffff"/>
  <g transform="rotate(-18 32 33)">
    <path d="M8 33 A24 9 0 0 0 56 33" fill="none" stroke="url(#orbit)" stroke-width="3" stroke-linecap="butt"/>
  </g>
  <circle cx="52.8" cy="26.3" r="3.6" fill="#c4b5fd"/>
  <circle cx="52.8" cy="26.3" r="3.6" fill="none" stroke="#ede9fe" stroke-width="0.8" stroke-opacity="0.75"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
